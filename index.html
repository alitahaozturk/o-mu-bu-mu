<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>O mu Bu mu?</title>
<meta name="theme-color" content="#7c4dff">
<meta name="description" content="Çocuklar için O mu Bu mu oyunu">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg1: #7c4dff;
    --bg2: #448aff;
    --card: #ffffff;
    --ink: #2b2250;
    --muted: #6b6390;
    --a: #ff8a3d;
    --b: #22c3a6;
    --danger: #ff4d6d;
    --radius: 28px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Nunito", "Segoe UI", Roboto, system-ui, sans-serif;
    background: linear-gradient(160deg, var(--bg1), var(--bg2));
    color: var(--ink);
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  .screen {
    position: fixed; inset: 0;
    display: none; flex-direction: column;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
  }
  .screen.active { display: flex; }
  button { font-family: inherit; color: inherit; cursor: pointer; border: 0; }

  /* ---------- Üst çubuk ---------- */
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 52px; }
  .round-btn {
    width: 52px; height: 52px; border-radius: 50%;
    background: rgba(255,255,255,.22); color: #fff; font-size: 26px;
    display: grid; place-items: center;
  }
  .round-btn:active { transform: scale(.92); }
  .title { color: #fff; font-weight: 900; font-size: 30px; text-align: center; text-shadow: 0 3px 0 rgba(0,0,0,.15); margin: 0; }

  /* ---------- Kategori ekranı ---------- */
  .cats {
    flex: 1; overflow-y: auto; padding: 12px 2px 8px;
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; align-content: start;
  }
  .cat {
    background: var(--card); border-radius: var(--radius);
    padding: 18px 8px 14px; display: flex; flex-direction: column; align-items: center; gap: 6px;
    box-shadow: 0 6px 0 rgba(0,0,0,.12);
    transition: transform .12s;
  }
  .cat:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.12); }
  .cat .emo { font-size: 60px; line-height: 1.1; }
  .cat .nm { font-weight: 800; font-size: 19px; text-align: center; }
  .cat[disabled] { opacity: .45; }

  /* ---------- Oyun ekranı ---------- */
  #game .progress { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; flex: 1; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: rgba(255,255,255,.3); }
  .dot.on { background: #ffd54f; }
  .duel { flex: 1; display: flex; flex-direction: column; gap: 14px; padding-top: 10px; position: relative; min-height: 0; }
  @media (orientation: landscape) { .duel { flex-direction: row; } }
  .choice {
    flex: 1; min-height: 0; border-radius: var(--radius); background: var(--card);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    box-shadow: 0 8px 0 rgba(0,0,0,.14);
    border: 6px solid transparent;
    transition: transform .15s;
  }
  .choice.a { border-color: var(--a); }
  .choice.b { border-color: var(--b); }
  .choice .emo { font-size: min(26vw, 17vh); line-height: 1.05; }
  .choice .nm { font-weight: 900; font-size: min(8vw, 34px); text-align: center; padding: 0 8px; }
  .choice:active { transform: scale(.97); }
  .choice.picked { animation: pop .45s ease; }
  .choice.leave { animation: leave .35s ease forwards; }
  .choice.enter { animation: enter .35s ease; }
  @keyframes pop { 0%{transform:scale(1)} 40%{transform:scale(1.06)} 100%{transform:scale(1)} }
  @keyframes leave { to { transform: scale(.6) rotate(-8deg); opacity: 0; } }
  @keyframes enter { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .vs {
    position: absolute; left: 50%; top: calc(50% + 5px); transform: translate(-50%, -50%);
    background: #ffd54f; color: var(--ink); font-weight: 900; font-size: 22px;
    padding: 10px 18px; border-radius: 999px; box-shadow: 0 4px 0 rgba(0,0,0,.18); pointer-events: none; z-index: 2;
  }
  .locked { pointer-events: none; }

  /* ---------- Sonuç ekranı ---------- */
  #result { align-items: center; justify-content: center; text-align: center; gap: 10px; }
  #result .big { font-size: min(45vw, 30vh); line-height: 1.05; animation: bounce 1.2s ease infinite; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)} }
  #result h2 { color: #fff; font-size: 26px; margin: 0; font-weight: 800; }
  #result .win { color: #fff; font-size: 44px; font-weight: 900; margin: 0; text-shadow: 0 4px 0 rgba(0,0,0,.18); }
  .btn {
    background: #ffd54f; color: var(--ink); font-weight: 900; font-size: 22px;
    padding: 16px 26px; border-radius: 999px; box-shadow: 0 6px 0 rgba(0,0,0,.18); min-width: 220px;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.18); }
  .btn.white { background: #fff; }
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 5; }

  /* ---------- Ebeveyn / ayarlar ---------- */
  .panel {
    flex: 1; overflow-y: auto; background: var(--card); border-radius: var(--radius);
    padding: 16px; margin-top: 12px; user-select: text; -webkit-user-select: text;
  }
  .panel h3 { margin: 18px 0 8px; font-size: 18px; }
  .panel h3:first-child { margin-top: 0; }
  .row { display: flex; align-items: center; gap: 10px; padding: 10px 4px; border-bottom: 1px solid #eee9ff; }
  .row .emo { font-size: 30px; width: 40px; text-align: center; }
  .row .nm { flex: 1; font-weight: 700; font-size: 17px; }
  .row .cnt { color: var(--muted); font-size: 14px; }
  .icon-btn { background: #f1edff; border-radius: 12px; padding: 8px 12px; font-size: 16px; font-weight: 800; }
  .icon-btn.del { background: #ffe3e8; color: #c9184a; }
  .add { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .add input {
    font: inherit; font-size: 17px; padding: 12px; border-radius: 14px; border: 2px solid #ddd5ff; min-width: 0;
  }
  .add input.emoji-in { width: 70px; text-align: center; font-size: 24px; padding: 8px; }
  .add input.name-in { flex: 1; }
  .add .icon-btn { background: var(--bg1); color: #fff; padding: 12px 16px; }
  .hint { color: var(--muted); font-size: 14px; margin: 6px 0 0; }
  .setting { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 4px; }
  .seg { display: flex; gap: 6px; }
  .seg button { background: #f1edff; padding: 8px 14px; border-radius: 12px; font-weight: 800; }
  .seg button.on { background: var(--bg1); color: #fff; }
  .danger-btn { background: #ffe3e8; color: #c9184a; padding: 12px 16px; border-radius: 14px; font-weight: 800; width: 100%; margin-top: 8px; }

  .gate { align-items: center; justify-content: center; text-align: center; gap: 16px; }
  .gate .q { color: #fff; font-size: 36px; font-weight: 900; margin: 0; }
  .gate p { color: #fff; margin: 0; font-size: 18px; }
  .gate input { font: inherit; font-size: 32px; width: 140px; text-align: center; padding: 10px; border-radius: 16px; border: 0; }

  .toast {
    position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%);
    background: rgba(20,10,50,.85); color: #fff; padding: 12px 20px; border-radius: 999px;
    font-weight: 700; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 10;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<!-- Ana ekran: kategori seçimi -->
<section id="home" class="screen active">
  <div class="topbar">
    <button class="round-btn" id="soundBtn" aria-label="Ses">🔊</button>
    <h1 class="title">O mu Bu mu?</h1>
    <button class="round-btn" id="settingsBtn" aria-label="Ebeveyn ayarları">⚙️</button>
  </div>
  <div class="cats" id="cats"></div>
</section>

<!-- Oyun ekranı -->
<section id="game" class="screen">
  <div class="topbar">
    <button class="round-btn" id="backBtn" aria-label="Geri">🏠</button>
    <div class="progress" id="progress"></div>
    <button class="round-btn" id="repeatBtn" aria-label="Tekrar söyle">🔁</button>
  </div>
  <div class="duel" id="duel">
    <button class="choice a" id="choiceA"><span class="emo"></span><span class="nm"></span></button>
    <div class="vs">VEYA</div>
    <button class="choice b" id="choiceB"><span class="emo"></span><span class="nm"></span></button>
  </div>
</section>

<!-- Sonuç ekranı -->
<section id="result" class="screen">
  <h2>Senin favorin</h2>
  <div class="big" id="winEmo"></div>
  <p class="win" id="winName"></p>
  <button class="btn" id="againBtn">🔄 Tekrar oyna</button>
  <button class="btn white" id="homeBtn">🏠 Başka konu</button>
</section>
<canvas id="confetti"></canvas>

<!-- Ebeveyn kapısı -->
<section id="gate" class="screen gate">
  <p>Bu bölüm anne-baba için 🙂</p>
  <p class="q" id="gateQ"></p>
  <input id="gateIn" type="number" inputmode="numeric" autocomplete="off">
  <button class="btn" id="gateOk">Gir</button>
  <button class="btn white" id="gateCancel">Vazgeç</button>
</section>

<!-- Ayarlar: kategori listesi -->
<section id="settings" class="screen">
  <div class="topbar">
    <button class="round-btn" id="setBack" aria-label="Geri">⬅️</button>
    <h1 class="title" style="font-size:24px">Ayarlar</h1>
    <span style="width:52px"></span>
  </div>
  <div class="panel">
    <h3>Bir turda kaç seçenek olsun?</h3>
    <div class="setting">
      <span>Seçenek sayısı</span>
      <div class="seg" id="roundSeg"></div>
    </div>
    <h3>Konular</h3>
    <p class="hint">İçindekileri düzenlemek için bir konuya dokunun.</p>
    <div id="catList"></div>
    <div class="add">
      <input class="emoji-in" id="newCatEmo" placeholder="🙂" maxlength="8">
      <input class="name-in" id="newCatName" placeholder="Yeni konu adı">
      <button class="icon-btn" id="addCat">Ekle</button>
    </div>
    <h3>Sıfırla</h3>
    <button class="danger-btn" id="resetAll">Tüm listeleri ilk haline döndür</button>
  </div>
</section>

<!-- Ayarlar: bir kategorinin öğeleri -->
<section id="editor" class="screen">
  <div class="topbar">
    <button class="round-btn" id="edBack" aria-label="Geri">⬅️</button>
    <h1 class="title" style="font-size:24px" id="edTitle"></h1>
    <span style="width:52px"></span>
  </div>
  <div class="panel">
    <div class="add" style="margin-top:0">
      <input class="emoji-in" id="newItemEmo" placeholder="🙂" maxlength="8">
      <input class="name-in" id="newItemName" placeholder="Yeni ekle (ör. Zebra)">
      <button class="icon-btn" id="addItem">Ekle</button>
    </div>
    <p class="hint">Resim için telefon klavyesinin emoji bölümünü kullanın. Oyun için en az 2 seçenek gerekir.</p>
    <div id="itemList" style="margin-top:8px"></div>
    <button class="danger-btn" id="delCat" style="margin-top:24px">Bu konuyu tamamen sil</button>
  </div>
</section>

<div class="toast" id="toast"></div>

<script>
(() => {
  "use strict";

  // ------------------------------------------------------------------
  // Varsayılan konular
  // ------------------------------------------------------------------
  const DEFAULTS = [
    { id: "hayvan", emoji: "🐾", name: "Hayvanlar", items: [
      ["🐱","Kedi"],["🐶","Köpek"],["🐮","İnek"],["🦁","Aslan"],["🐘","Fil"],["🐰","Tavşan"],
      ["🐵","Maymun"],["🦒","Zürafa"],["🐧","Penguen"],["🐴","At"],["🐬","Yunus"],["🐻","Ayı"],
      ["🐢","Kaplumbağa"],["🦊","Tilki"]]},
    { id: "meyve", emoji: "🍎", name: "Meyveler", items: [
      ["🍎","Elma"],["🍌","Muz"],["🍓","Çilek"],["🍉","Karpuz"],["🍇","Üzüm"],["🍊","Portakal"],
      ["🍒","Kiraz"],["🍐","Armut"],["🍍","Ananas"],["🍑","Şeftali"],["🥝","Kivi"],["🥭","Mango"]]},
    { id: "yiyecek", emoji: "🍕", name: "Yiyecekler", items: [
      ["🍕","Pizza"],["🍔","Hamburger"],["🍝","Makarna"],["🍟","Patates kızartması"],["🍦","Dondurma"],
      ["🎂","Pasta"],["🍲","Çorba"],["🍳","Yumurta"],["🥞","Krep"],["🍪","Kurabiye"],["🍫","Çikolata"],
      ["🍿","Patlamış mısır"]]},
    { id: "arac", emoji: "🚗", name: "Araçlar", items: [
      ["🚗","Araba"],["🚌","Otobüs"],["✈️","Uçak"],["🚂","Tren"],["🚢","Gemi"],["🚲","Bisiklet"],
      ["🚁","Helikopter"],["🚀","Roket"],["🚒","İtfaiye"],["🚑","Ambulans"],["🚜","Traktör"],["🏍️","Motosiklet"]]},
    { id: "renk", emoji: "🎨", name: "Renkler", items: [
      ["❤️","Kırmızı"],["💙","Mavi"],["💚","Yeşil"],["💛","Sarı"],["🧡","Turuncu"],["💜","Mor"],
      ["🌸","Pembe"],["🤎","Kahverengi"],["🖤","Siyah"],["🤍","Beyaz"]]},
    { id: "oyun", emoji: "⚽", name: "Oyunlar ve Sporlar", items: [
      ["⚽","Futbol"],["🏀","Basketbol"],["🏊","Yüzme"],["🚴","Bisiklet sürmek"],["🙈","Saklambaç"],
      ["🧱","Lego"],["🖍️","Boyama"],["🎾","Tenis"],["🛹","Kaykay"],["💃","Dans"],["🪁","Uçurtma"],["🧩","Yapboz"]]},
    { id: "guc", emoji: "🦸", name: "Süper Güçler", items: [
      ["🕊️","Uçmak"],["👻","Görünmez olmak"],["💪","Çok güçlü olmak"],["⚡","Çok hızlı koşmak"],
      ["🐠","Su altında nefes almak"],["🐾","Hayvanlarla konuşmak"],["✨","Işınlanmak"],["⏰","Zamanı durdurmak"],
      ["🐜","Karınca kadar küçülmek"],["🔥","Ateş püskürmek"],["🪄","Sihir yapmak"]]},
    { id: "yer", emoji: "🌍", name: "Yerler", items: [
      ["🏖️","Deniz"],["🌲","Orman"],["🏔️","Dağ"],["🎡","Lunapark"],["🦓","Hayvanat bahçesi"],["⛲","Park"],
      ["🌌","Uzay"],["🏜️","Çöl"],["⛺","Kamp"],["🐠","Akvaryum"],["🏰","Şato"],["🏝️","Ada"]]},
  ];

  const STORE_KEY = "omubumu.v1";
  const clone = o => JSON.parse(JSON.stringify(o));
  const defaultState = () => ({
    sound: true,
    roundSize: 8,
    cats: DEFAULTS.map(c => ({ id: c.id, emoji: c.emoji, name: c.name,
      items: c.items.map(([emoji, name]) => ({ emoji, name })) })),
  });

  let state;
  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      state = raw ? JSON.parse(raw) : defaultState();
      if (!state || !Array.isArray(state.cats)) state = defaultState();
    } catch (e) { state = defaultState(); }
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
  }
  load();

  // ------------------------------------------------------------------
  // Yardımcılar
  // ------------------------------------------------------------------
  const $ = id => document.getElementById(id);
  const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

  // Türkçe soru eki: kedi mi, kuş mu, köpek mi, gül mü, aslan mı
  function soruEki(word) {
    const m = word.toLocaleLowerCase("tr").match(/[aeıioöuü](?=[^aeıioöuü]*$)/);
    const v = m ? m[0] : "e";
    if ("aı".includes(v)) return "mı";
    if ("ei".includes(v)) return "mi";
    if ("ou".includes(v)) return "mu";
    return "mü";
  }
  const q = name => `${name} ${soruEki(name)}`;

  function showScreen(id) {
    document.querySelectorAll(".screen").forEach(s => s.classList.toggle("active", s.id === id));
    if (id !== "home" && !(history.state && history.state.s === "app")) history.pushState({ s: "app" }, "");
  }

  let toastTimer;
  function toast(msg) {
    const t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
  }

  // ------------------------------------------------------------------
  // Ses: konuşma + küçük efektler
  // ------------------------------------------------------------------
  let trVoice = null;
  function pickVoice() {
    if (!("speechSynthesis" in window)) return;
    const vs = speechSynthesis.getVoices();
    trVoice = vs.find(v => /^tr/i.test(v.lang)) || null;
  }
  if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

  function say(text) {
    if (!state.sound || !("speechSynthesis" in window)) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "tr-TR"; if (trVoice) u.voice = trVoice;
      u.rate = 0.9; u.pitch = 1.15;
      speechSynthesis.speak(u);
    } catch (e) {}
  }

  let actx;
  function beep(freqs, dur = 0.12, type = "triangle", gap = 0.09) {
    if (!state.sound) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      freqs.forEach((f, i) => {
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = type; o.frequency.value = f;
        const t0 = actx.currentTime + i * gap;
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0 + dur + 0.02);
      });
    } catch (e) {}
  }
  const sfxPick = () => beep([660, 880]);
  const sfxWin = () => beep([523, 659, 784, 1047, 784, 1047], 0.18, "triangle", 0.13);

  function renderSoundBtn() { $("soundBtn").textContent = state.sound ? "🔊" : "🔇"; }
  $("soundBtn").onclick = () => {
    state.sound = !state.sound; save(); renderSoundBtn();
    if (!state.sound && "speechSynthesis" in window) speechSynthesis.cancel();
    toast(state.sound ? "Ses açık" : "Ses kapalı");
  };

  // ------------------------------------------------------------------
  // Ana ekran
  // ------------------------------------------------------------------
  function renderHome() {
    renderSoundBtn();
    const box = $("cats"); box.innerHTML = "";
    state.cats.forEach(c => {
      const b = document.createElement("button");
      b.className = "cat";
      b.innerHTML = `<span class="emo">${esc(c.emoji)}</span><span class="nm">${esc(c.name)}</span>`;
      if (c.items.length < 2) b.setAttribute("disabled", "");
      b.onclick = () => startGame(c.id);
      box.appendChild(b);
    });
  }

  // ------------------------------------------------------------------
  // Oyun: kazanan kalır, yenisi gelir
  // ------------------------------------------------------------------
  let game = null;

  function startGame(catId) {
    const cat = state.cats.find(c => c.id === catId);
    if (!cat || cat.items.length < 2) return;
    const pool = shuffle(cat.items).slice(0, Math.min(state.roundSize, cat.items.length));
    game = { catId, pool, a: pool[0], b: pool[1], next: 2, step: 0, total: pool.length - 1, busy: false };
    showScreen("game");
    renderDuel(true);
  }

  function setCard(el, item, anim) {
    el.querySelector(".emo").textContent = item.emoji;
    el.querySelector(".nm").textContent = item.name;
    el.setAttribute("aria-label", item.name);
    if (anim) { el.classList.remove("enter"); void el.offsetWidth; el.classList.add("enter"); }
  }

  function renderProgress() {
    const p = $("progress"); p.innerHTML = "";
    for (let i = 0; i < game.total; i++) {
      const d = document.createElement("span");
      d.className = "dot" + (i < game.step ? " on" : "");
      p.appendChild(d);
    }
  }

  function askAloud() { say(`${q(game.a.name)}, ${q(game.b.name)}?`); }

  function renderDuel(first) {
    setCard($("choiceA"), game.a, first);
    setCard($("choiceB"), game.b, first);
    renderProgress();
    askAloud();
  }

  function choose(side) {
    if (!game || game.busy) return;
    game.busy = true;
    const winEl = side === "a" ? $("choiceA") : $("choiceB");
    const loseEl = side === "a" ? $("choiceB") : $("choiceA");
    const winner = side === "a" ? game.a : game.b;
    game.step++;
    sfxPick();
    renderProgress();
    $("duel").classList.add("locked");
    winEl.classList.remove("picked"); void winEl.offsetWidth; winEl.classList.add("picked");
    loseEl.classList.add("leave");

    setTimeout(() => {
      loseEl.classList.remove("leave");
      if (game.next >= game.pool.length) { finish(winner); return; }
      const newcomer = game.pool[game.next++];
      if (side === "a") game.b = newcomer; else game.a = newcomer;
      setCard(loseEl, newcomer, true);
      askAloud();
      $("duel").classList.remove("locked");
      game.busy = false;
    }, 420);
  }

  $("choiceA").onclick = () => choose("a");
  $("choiceB").onclick = () => choose("b");
  $("repeatBtn").onclick = () => game && askAloud();
  $("backBtn").onclick = () => { if ("speechSynthesis" in window) speechSynthesis.cancel(); game = null; renderHome(); showScreen("home"); };

  function finish(winner) {
    $("duel").classList.remove("locked");
    $("winEmo").textContent = winner.emoji;
    $("winName").textContent = winner.name + "!";
    showScreen("result");
    sfxWin();
    setTimeout(() => say(`Senin favorin: ${winner.name}!`), 350);
    confetti();
  }
  $("againBtn").onclick = () => { stopConfetti(); startGame(game.catId); };
  $("homeBtn").onclick = () => { stopConfetti(); game = null; renderHome(); showScreen("home"); };

  // ------------------------------------------------------------------
  // Konfeti
  // ------------------------------------------------------------------
  let confRaf = null;
  function confetti() {
    const cv = $("confetti"), ctx = cv.getContext("2d");
    const dpr = window.devicePixelRatio || 1;
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const colors = ["#ffd54f", "#ff8a3d", "#22c3a6", "#ff4d6d", "#ffffff", "#7cdcff"];
    const parts = Array.from({ length: 140 }, () => ({
      x: Math.random() * innerWidth, y: -20 - Math.random() * innerHeight * 0.6,
      vx: (Math.random() - 0.5) * 3, vy: 2 + Math.random() * 3.5,
      s: 6 + Math.random() * 8, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3,
      c: colors[Math.floor(Math.random() * colors.length)],
    }));
    const t0 = performance.now();
    cancelAnimationFrame(confRaf);
    (function frame(t) {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      parts.forEach(p => {
        p.x += p.vx; p.y += p.vy; p.r += p.vr; p.vy += 0.03;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
        ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore();
      });
      if (t - t0 < 4500) confRaf = requestAnimationFrame(frame); else ctx.clearRect(0, 0, innerWidth, innerHeight);
    })(t0);
  }
  function stopConfetti() {
    cancelAnimationFrame(confRaf);
    const cv = $("confetti"); cv.getContext("2d").clearRect(0, 0, cv.width, cv.height);
  }

  // ------------------------------------------------------------------
  // Ebeveyn kapısı
  // ------------------------------------------------------------------
  let gateAnswer = 0;
  $("settingsBtn").onclick = () => {
    const x = 6 + Math.floor(Math.random() * 4), y = 5 + Math.floor(Math.random() * 4);
    gateAnswer = x + y;
    $("gateQ").textContent = `${x} + ${y} = ?`;
    $("gateIn").value = "";
    showScreen("gate");
    setTimeout(() => $("gateIn").focus(), 100);
  };
  function tryGate() {
    if (Number($("gateIn").value) === gateAnswer) { renderSettings(); showScreen("settings"); }
    else { toast("Olmadı, tekrar deneyin"); $("gateIn").value = ""; }
  }
  $("gateOk").onclick = tryGate;
  $("gateIn").addEventListener("keydown", e => { if (e.key === "Enter") tryGate(); });
  $("gateCancel").onclick = () => showScreen("home");

  // ------------------------------------------------------------------
  // Ayarlar
  // ------------------------------------------------------------------
  function renderSettings() {
    const seg = $("roundSeg"); seg.innerHTML = "";
    [4, 6, 8, 10].forEach(n => {
      const b = document.createElement("button");
      b.textContent = n; if (state.roundSize === n) b.className = "on";
      b.onclick = () => { state.roundSize = n; save(); renderSettings(); };
      seg.appendChild(b);
    });
    const list = $("catList"); list.innerHTML = "";
    state.cats.forEach(c => {
      const r = document.createElement("div"); r.className = "row";
      r.innerHTML = `<span class="emo">${esc(c.emoji)}</span><span class="nm">${esc(c.name)}</span>
        <span class="cnt">${c.items.length} seçenek</span><button class="icon-btn">Düzenle</button>`;
      r.querySelector("button").onclick = () => openEditor(c.id);
      list.appendChild(r);
    });
  }

  $("setBack").onclick = () => { renderHome(); showScreen("home"); };

  $("addCat").onclick = () => {
    const name = $("newCatName").value.trim();
    const emoji = $("newCatEmo").value.trim() || "⭐";
    if (!name) { toast("Konu adı yazın"); return; }
    const id = "c" + Date.now().toString(36);
    state.cats.push({ id, emoji, name, items: [] });
    save();
    $("newCatName").value = ""; $("newCatEmo").value = "";
    openEditor(id);
  };

  $("resetAll").onclick = () => {
    if (!confirm("Tüm konular ve listeler ilk haline dönsün mü? Yaptığınız değişiklikler silinir.")) return;
    const sound = state.sound;
    state = defaultState(); state.sound = sound; save();
    renderSettings(); toast("İlk haline döndü");
  };

  // ------------------------------------------------------------------
  // Konu düzenleyici
  // ------------------------------------------------------------------
  let editingId = null;
  function openEditor(id) { editingId = id; renderEditor(); showScreen("editor"); }

  function renderEditor() {
    const c = state.cats.find(x => x.id === editingId);
    if (!c) { renderSettings(); showScreen("settings"); return; }
    $("edTitle").textContent = `${c.emoji} ${c.name}`;
    const list = $("itemList"); list.innerHTML = "";
    if (!c.items.length) list.innerHTML = `<p class="hint">Henüz seçenek yok. Yukarıdan ekleyin.</p>`;
    c.items.forEach((it, i) => {
      const r = document.createElement("div"); r.className = "row";
      r.innerHTML = `<span class="emo">${esc(it.emoji)}</span><span class="nm">${esc(it.name)}</span>
        <button class="icon-btn del" aria-label="Sil">Sil</button>`;
      r.querySelector("button").onclick = () => {
        c.items.splice(i, 1); save(); renderEditor(); toast(`${it.name} silindi`);
      };
      list.appendChild(r);
    });
  }

  function addItem() {
    const c = state.cats.find(x => x.id === editingId); if (!c) return;
    const name = $("newItemName").value.trim();
    const emoji = $("newItemEmo").value.trim() || "⭐";
    if (!name) { toast("Bir isim yazın"); return; }
    if (c.items.some(it => it.name.toLocaleLowerCase("tr") === name.toLocaleLowerCase("tr"))) { toast("Bu zaten listede"); return; }
    c.items.unshift({ emoji, name }); save();
    $("newItemName").value = ""; $("newItemEmo").value = "";
    renderEditor(); toast(`${name} eklendi`);
    $("newItemEmo").focus();
  }
  $("addItem").onclick = addItem;
  $("newItemName").addEventListener("keydown", e => { if (e.key === "Enter") addItem(); });

  $("delCat").onclick = () => {
    const c = state.cats.find(x => x.id === editingId); if (!c) return;
    if (!confirm(`"${c.name}" konusu silinsin mi?`)) return;
    state.cats = state.cats.filter(x => x.id !== editingId); save();
    renderSettings(); showScreen("settings");
  };
  $("edBack").onclick = () => { renderSettings(); showScreen("settings"); };

  // Android geri tuşu: alt ekranlardan ana ekrana döner, ana ekranda uygulamadan çıkar
  history.replaceState({ s: "root" }, "");
  window.addEventListener("popstate", () => {
    const active = document.querySelector(".screen.active").id;
    if (active === "home") return;
    history.pushState({ s: "app" }, "");
    if (active === "editor") $("edBack").click();
    else if (active !== "home") { stopConfetti(); if ("speechSynthesis" in window) speechSynthesis.cancel(); renderHome(); showScreen("home"); }
  });

  renderHome();

  // Çevrimdışı çalışma
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
})();
</script>
</body>
</html>
